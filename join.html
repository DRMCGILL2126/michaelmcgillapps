<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a Family on Farrow</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            background-color: #000;
            color: #fff;
            text-align: center;
        }
        h1 { color: #fff; margin-top: 40px; }
        p { color: #aaa; }
        .code {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: #d4af37;
            margin: 24px 0;
            font-family: ui-monospace, Menlo, monospace;
        }
        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
        }
        .btn {
            display: inline-block;
            margin-top: 16px;
            padding: 14px 28px;
            border-radius: 12px;
            background: #d4af37;
            color: #000;
            text-decoration: none;
            font-weight: 600;
        }
        a { color: #007AFF; }
    </style>
</head>
<body>
    <img src="farrow/icon.png" alt="" width="88" height="88" style="border-radius:20px;margin-top:40px;">
    <h1 style="margin-top:16px;">Join your family on Farrow</h1>
    <p id="intro">Opening the app…</p>

    <div class="card">
        <p>Your invite code:</p>
        <div class="code" id="code">------</div>
        <p id="fallback-message">
            If Farrow didn't open automatically, make sure it's installed,
            then open it, tap <strong>I have a code</strong> and enter this code.
        </p>
        <!-- When Farrow is live, make this the App Store link:
             https://apps.apple.com/app/id6813650643 -->
        <a class="btn" href="farrow.html">Get Farrow</a>
        <p style="margin-top:16px;font-size:0.9rem;">Kids: choose <em>I'm a kid</em> — no Apple ID or email needed.</p>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var code = (params.get('code') || '').toUpperCase().slice(0, 6);
        if (code) {
            document.getElementById('code').textContent = code;
            // Universal Links open the app directly when it's installed —
            // this page only renders as a fallback. Still attempt the
            // custom-scheme link as a second chance (e.g. if Associated
            // Domains verification hasn't propagated yet), then give up
            // and just show the code.
            window.location.replace('kidbank://join/' + code);
        } else {
            document.getElementById('intro').textContent = 'Missing invite code.';
        }
    </script>
</body>
</html>
