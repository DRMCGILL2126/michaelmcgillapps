<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download PropaneScout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 480px;
    }
    .flame { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .tagline {
      color: #aaa;
      font-size: 16px;
      margin-bottom: 40px;
      line-height: 1.5;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      margin-bottom: 14px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-ios { background: #1a1a1a; border: 1.5px solid #333; }
    .btn-android { background: #1a1a1a; border: 1.5px solid #333; }
    .btn img { width: 28px; height: 28px; }
    .btn-label { text-align: left; }
    .btn-sub { display: block; font-size: 11px; font-weight: 400; color: #888; }
    .btn-main { display: block; font-size: 16px; }
    .redirect-msg {
      margin-top: 32px;
      font-size: 13px;
      color: #555;
    }
  </style>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isAndroid = /android/i.test(ua);

      var iosUrl = 'https://apps.apple.com/app/propane-scout/id6744827498';
      var androidUrl = 'https://play.google.com/store/apps/details?id=com.mcgill.propanefinder';

      if (isIOS) {
        document.getElementById('redirect-msg').textContent = 'Redirecting you to the App Store…';
        setTimeout(function() { window.location.href = iosUrl; }, 800);
      } else if (isAndroid) {
        document.getElementById('redirect-msg').textContent = 'Redirecting you to Google Play…';
        setTimeout(function() { window.location.href = androidUrl; }, 800);
      }
    });
  </script>
</head>
<body>
  <div class="container">
    <div class="flame">🔥</div>
    <h1>PropaneScout</h1>

      <span class="btn-label">
        <span class="btn-sub">Download on the</span>

    </a>

    <a href="https://play.google.com/store/apps/details?id=com.mcgill.propanefinder" class="btn btn-android">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M3.18 23.76c.3.17.64.19.96.08l.05-.03 10.79-6.22-2.31-2.31-9.49 8.48zm14.09-8.15L14.96 13l2.67-2.67 4.14 2.39c1.18.68 1.18 1.79 0 2.47l-4.5 2.42zM2.01 1.05C1.84 1.3 1.75 1.62 1.75 1.99v19.2c0 .37.09.68.26.93l.05.07 10.76-10.76v-.25L2.06.98l-.05.07zm10.51 11.19l2.62-2.62-2.62-2.62L2.06 1.05 12.52 12.24z"/></svg>

</body>
</html>
